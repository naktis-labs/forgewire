[package]
name = "foundry-connector"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# Interoperability harness support. It enables the disposable local Foundry
# world (`interop`) and the loopback-only client constructor
# (`FoundryClient::for_loopback`) the harness drives the real connector with.
# The released server never enables it: the production client stays
# HTTPS-only, and the harness client is refused for any non-loopback host.
loopback-interop = ["dep:axum"]

[dependencies]
anyhow.workspace = true
axum = { version = "0.8", features = ["ws"], optional = true }
futures-util.workspace = true
http.workspace = true
rand.workspace = true
reqwest.workspace = true
ring = "0.17.14"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
url.workspace = true

[dev-dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { workspace = true, features = ["test-util"] }
